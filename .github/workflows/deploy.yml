name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add private portrait (kept out of the repo)
        env:
          PORTRAIT_B64: ${{ secrets.PORTRAIT_B64 }}
        run: |
          test -n "$PORTRAIT_B64" || { echo "Missing PORTRAIT_B64 secret"; exit 1; }
          echo "$PORTRAIT_B64" | base64 -d > public/portrait-bust.webp
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ajay-bobbili.github.io
          NEXT_PUBLIC_BASE_PATH: /my-portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
